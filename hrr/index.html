<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRR List - KRM FORUM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0d14;
            --panel-bg: #121824;
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f2fe;
            --accent-orange: #ff9f43;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Pretendard', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(18, 24, 36, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            height: 64px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-family: 'Orbitron'; font-size: 20px; font-weight: 900; color: var(--accent-cyan); text-decoration: none; }

        .container {
            display: flex;
            flex-grow: 1;
            height: calc(100vh - 64px);
            overflow: hidden;
            position: relative;
        }

        .sidebar {
            width: 340px;
            background: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s ease;
            z-index: 10;
        }

        .sidebar.collapsed { margin-left: -340px; }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--panel-border);
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .map-list { flex-grow: 1; overflow-y: auto; list-style: none; }
        .map-item {
            padding: 14px 18px;
            border-bottom: 1px solid var(--panel-border);
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .map-item:hover, .map-item.active { background: rgba(0, 242, 254, 0.08); }
        .map-item .rank { font-family: 'Orbitron'; color: var(--accent-cyan); font-weight: 800; font-size: 14px; flex-shrink: 0; min-width: 45px; }
        .map-item .title { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .toggle-btn {
            position: absolute;
            left: 340px;
            top: 16px;
            z-index: 20;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            transition: left 0.3s ease;
        }
        .sidebar.collapsed + .toggle-btn { left: 0; }

        .main-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content-box { width: 100%; max-width: 960px; }

        .map-header-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .map-main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
        }

        .map-aredl-badge {
            font-family: 'Orbitron';
            color: var(--accent-orange);
            font-size: 18px;
            font-weight: 800;
            background: rgba(255, 159, 67, 0.12);
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 159, 67, 0.3);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 16fr 9fr;
            gap: 24px;
            margin-bottom: 32px;
        }

        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
        }

        .video-box iframe { width: 100%; height: 100%; border: none; }

        .info-side { display: flex; flex-direction: column; gap: 16px; }

        .stat-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
        }

        .stat-label { font-size: 13px; color: var(--text-sub); margin-bottom: 6px; font-weight: 600; }
        .stat-value { font-size: 22px; font-weight: 800; }

        .victors-btn {
            width: 100%;
            padding: 16px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .victors-list-box {
            display: none;
            margin-top: 12px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            max-height: 280px;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .victors-list-box.active { display: block; }

        .victor-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .victor-item:last-child { border-bottom: none; }
        .victor-rank { font-family: 'Orbitron'; color: var(--text-sub); font-size: 14px; width: 36px; }
        .victor-name { font-size: 16px; color: var(--text-main); text-decoration: none; }
        .victor-name.has-link { text-decoration: underline; color: var(--accent-cyan); cursor: pointer; }

        @media (max-width: 768px) {
            .detail-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">KRM FORUM</a>
        <div style="font-family:'Orbitron'; font-weight:800; color:var(--accent-cyan);">HRR LIST</div>
    </header>

    <div class="container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <input type="text" class="search-input" id="searchInput" placeholder="맵 이름 검색..." oninput="filterMaps()">
            </div>
            <ul class="map-list" id="mapList"></ul>
        </aside>

        <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

        <main class="main-content">
            <div class="content-box">
                <div class="map-header-row">
                    <h1 class="map-main-title" id="mapTitle">#1. Loading...</h1>
                    <span class="map-aredl-badge" id="mapAredlBadge" style="display:none;">AREDL -</span>
                </div>

                <div class="detail-grid">
                    <div class="video-box" id="videoContainer">
                        <span>영상을 불러오는 중...</span>
                    </div>

                    <div class="info-side">
                        <div class="stat-card" style="border-left: 4px solid var(--accent-cyan);">
                            <div class="stat-label">First Korean HRR Mobile Victor</div>
                            <div class="stat-value" id="firstVictorName">-</div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-label">Total Victors</div>
                            <div class="stat-value" id="totalVictorsCount">-</div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-label">List Points</div>
                            <div class="stat-value" id="listPoints">-</div>
                        </div>
                    </div>
                </div>

                <button class="victors-btn" onclick="toggleVictorsBox()">
                    <span>전체 클리어자 목록 (Victors)</span>
                    <span id="arrowIcon">▼</span>
                </button>
                <div class="victors-list-box" id="victorsBox">
                    <div id="victorsContainer"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const HRR_SHEET_ID = '1f1lwB1kbOpD4IWBiTf-D3wDeqpCA5nz-fkNIhr4ZO14';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${HRR_SHEET_ID}/export?format=csv&gid=0`;

        let mapDataList = [];

        async function loadSheetData() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const csvText = await response.text();
                parseCSV(csvText);
            } catch (err) {
                console.error("데이터 로드 실패:", err);
                document.getElementById('mapTitle').innerText = "데이터 로드 실패";
            }
        }

        // 따옴표와 쉼표 처리가 완전한 정식 CSV 파서
        function parseCSVLine(line) {
            const values = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    values.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            values.push(current.trim());
            return values;
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            mapDataList = [];

            let currentRank = 1;

            for (let i = 2; i < lines.length; i++) {
                const cols = parseCSVLine(lines[i]);
                const levelName = cols[0] ? cols[0].replace(/^"(.*)"$/, '$1').trim() : '';

                if (!levelName) continue;

                if (levelName.startsWith('Last update') || levelName.startsWith('Records & Information')) {
                    break;
                }

                /* [구글 시트 열 매핑]
                  A열(cols[0]): Levels (맵 이름)
                  B열(cols[1]): Total Victors (총 클리어 수)
                  C열(cols[2]): Aredl Placements (AREDL 순위)
                  D열(cols[3]): HRR List Placements (List Points)
                  E열(cols[4]): Notes / 비고
                  F열(cols[5]): Video Links (최초 클리어 영상 링크)
                  G열~(cols[6]~): Victors (클리어자 이름 및 개별 링크)
                */
                const totalVictors = cols[1] || '0';
                const aredlPlacement = cols[2] || '';
                const listPoints = cols[3] || '-';
                const mainVideoUrl = cols[5] || '';

                // G열부터 클리어자 목록 시작
                const rawVictors = cols.slice(6).filter(cell => cell && cell.length > 0);
                const victors = rawVictors.map(item => {
                    const cleanItem = item.replace(/^"(.*)"$/, '$1').trim();
                    return {
                        name: cleanItem,
                        link: cleanItem.startsWith('http') ? cleanItem : null
                    };
                });

                mapDataList.push({
                    rank: `#${currentRank}`,
                    title: levelName,
                    aredl: aredlPlacement,
                    totalVictors: totalVictors,
                    listPoints: listPoints,
                    videoUrl: mainVideoUrl,
                    victors: victors
                });

                currentRank++;
            }

            renderSidebar(mapDataList);
            
            // 뒤로가기/URL Hash 대응
            handleHashChange();
        }

        function renderSidebar(data) {
            const listEl = document.getElementById('mapList');
            listEl.innerHTML = '';
            data.forEach((map) => {
                // 검색 시 인덱스 꼬임 방지를 위해 원본 인덱스 참조
                const originalIndex = mapDataList.findIndex(m => m.rank === map.rank);
                const li = document.createElement('li');
                li.className = 'map-item';
                li.onclick = () => selectMap(originalIndex);

                li.innerHTML = `
                    <span class="rank">${map.rank}</span>
                    <span class="title">${map.title}</span>
                `;
                listEl.appendChild(li);
            });
        }

        function selectMap(index) {
            const map = mapDataList[index];
            if (!map) return;

            // URL Hash 업데이트 (뒤로가기/앞으로가기 지원)
            if (window.location.hash !== `#${index + 1}`) {
                history.pushState(null, null, `#${index + 1}`);
            }

            document.querySelectorAll('.map-item').forEach((el) => {
                const isSelected = el.querySelector('.rank')?.innerText === map.rank;
                el.classList.toggle('active', isSelected);
            });

            document.getElementById('mapTitle').innerText = `${map.rank}. ${map.title}`;
            
            const aredlBadge = document.getElementById('mapAredlBadge');
            if (map.aredl && map.aredl !== '-' && map.aredl !== '0') {
                aredlBadge.innerText = `AREDL #${map.aredl.replace('#', '')}`;
                aredlBadge.style.display = 'inline-block';
            } else {
                aredlBadge.style.display = 'none';
            }

            document.getElementById('totalVictorsCount').innerText = map.totalVictors;
            document.getElementById('listPoints').innerText = map.listPoints;

            // 영상 영역 처리 (F열의 Video URL 우선, 없을 경우 첫 클리어자 링크 확인)
            const videoBox = document.getElementById('videoContainer');
            let targetVideo = map.videoUrl;

            if (!targetVideo && map.victors.length > 0 && map.victors[0].link) {
                targetVideo = map.victors[0].link;
            }

            if (targetVideo && targetVideo.includes('youtu')) {
                const videoId = extractYoutubeId(targetVideo);
                if (videoId) {
                    videoBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
                } else {
                    videoBox.innerHTML = `<span style="color:#64748b;">등록된 영상이 없습니다.</span>`;
                }
            } else {
                videoBox.innerHTML = `<span style="color:#64748b;">등록된 영상이 없습니다.</span>`;
            }

            // 최초 클리어자 이름 표시 (첫 번째 Victor 이름)
            if (map.victors.length > 0) {
                document.getElementById('firstVictorName').innerText = map.victors[0].name;
            } else {
                document.getElementById('firstVictorName').innerText = '-';
            }

            renderVictorsList(map.victors);
        }

        function renderVictorsList(victors) {
            const container = document.getElementById('victorsContainer');
            container.innerHTML = '';

            if (!victors || victors.length === 0) {
                container.innerHTML = '<div style="color:var(--text-sub); font-size:14px;">클리어자가 없습니다.</div>';
                return;
            }

            victors.forEach((v, idx) => {
                const item = document.createElement('div');
                item.className = 'victor-item';
                const rankSpan = `<span class="victor-rank">${idx + 1}.</span>`;
                
                let nameEl = v.link 
                    ? `<a href="${v.link}" target="_blank" class="victor-name has-link">${v.name}</a>`
                    : `<span class="victor-name">${v.name}</span>`;

                item.innerHTML = rankSpan + nameEl;
                container.appendChild(item);
            });
        }

        // 유튜브 일반 URL, Short, embed 형태 모두 파싱 가능
        function extractYoutubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function toggleVictorsBox() {
            const box = document.getElementById('victorsBox');
            box.classList.toggle('active');
            document.getElementById('arrowIcon').innerText = box.classList.contains('active') ? '▲' : '▼';
        }

        // 검색 기능 (검색 시에도 원래 클릭 인덱스가 유지됨)
        function filterMaps() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = mapDataList.filter(m => m.title.toLowerCase().includes(query));
            renderSidebar(filtered);
        }

        function handleHashChange() {
            const hash = window.location.hash.replace('#', '');
            const targetIndex = hash ? parseInt(hash) - 1 : 0;
            if (mapDataList.length > 0) {
                selectMap(Math.max(0, Math.min(targetIndex, mapDataList.length - 1)));
            }
        }

        // 브라우저 뒤로가기 / 앞으로가기 이벤트 핸들링
        window.addEventListener('hashchange', handleHashChange);

        loadSheetData();
    </script>
</body>
</html>
