<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LRR List - KRM FORUM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Pretendard:wght@400;600;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-dark: #0a0d14;
      --panel-bg: #121824;
      --panel-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f2fe;
      --accent-orange: #ff9f43;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Pretendard', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background: rgba(18, 24, 36, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--panel-border);
      height: 64px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-family: 'Orbitron';
      font-size: 18px;
      font-weight: 900;
      color: var(--accent-orange);
      text-decoration: none;
    }
    .header-right {
      font-family: 'Orbitron';
      font-size: 14px;
      font-weight: 800;
      color: var(--accent-orange);
      text-decoration: none;
    }

    .container {
      display: flex;
      flex-grow: 1;
      min-height: calc(100vh - 64px);
      position: relative;
      justify-content: center;
      width: 100%;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 64px;
      left: 0;
      width: 100%;
      height: calc(100vh - 64px);
      background: rgba(0, 0, 0, 0.6);
      z-index: 99;
    }
    .sidebar-overlay.active { display: block; }

    .sidebar {
      width: 300px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      position: fixed;
      height: calc(100vh - 64px);
      z-index: 100;
      left: 0;
      top: 64px;
      transform: translateX(-100%);
    }

    .sidebar.open { transform: translateX(0); }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }

    .close-sidebar-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .map-list { flex-grow: 1; overflow-y: auto; list-style: none; }

    .map-item {
      padding: 14px 18px;
      border-bottom: 1px solid var(--panel-border);
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .map-item:hover, .map-item.active { background: rgba(255, 159, 67, 0.1); }

    .map-item .rank {
      font-family: 'Orbitron';
      color: var(--accent-orange);
      font-weight: 800;
      font-size: 14px;
      min-width: 40px;
      flex-shrink: 0;
    }

    .map-item .title {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
    }

    .toggle-btn {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      width: 42px;
      height: 42px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      margin: 0 auto 12px auto;
    }

    .main-content {
      flex-grow: 1;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .content-box {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .map-header-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      width: 100%;
      text-align: center;
    }

    .map-main-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(20px, 6vw, 32px);
      font-weight: 900;
      word-break: keep-all;
      overflow-wrap: break-word;
      text-align: center;
      line-height: 1.3;
      margin-bottom: 10px;
      width: 100%;
    }

    .map-aredl-badge {
      font-family: 'Orbitron';
      color: var(--accent-orange);
      font-size: 14px;
      font-weight: 800;
      background: rgba(255, 159, 67, 0.12);
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 159, 67, 0.3);
      display: inline-block;
    }

    .detail-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
      width: 100%;
      align-items: center;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
    }

    .video-box iframe { width: 100%; height: 100%; border: none; }

    .info-side { display: flex; flex-direction: column; gap: 12px; width: 100%; }

    .stat-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 16px;
      width: 100%;
    }

    .stat-label { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; font-weight: 600; }
    .stat-value { font-size: 18px; font-weight: 800; word-break: break-all; }

    .victors-btn {
      width: 100%;
      padding: 14px 16px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .victors-list-box {
      display: none;
      margin-top: 10px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      max-height: 240px;
      overflow-y: auto;
      padding: 14px 16px;
      width: 100%;
    }

    .victors-list-box.active { display: block; }

    .victor-item {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .victor-item:last-child { border-bottom: none; }
    .victor-rank { font-family: 'Orbitron'; color: var(--text-sub); font-size: 13px; width: 30px; }
    .victor-name { font-size: 15px; color: var(--text-main); text-decoration: none; }
    .victor-name.has-link { text-decoration: underline; color: var(--accent-orange); cursor: pointer; }

    @media (min-width: 768px) {
      header { padding: 0 32px; height: 72px; }
      .logo { font-size: 20px; }
      .container { justify-content: flex-start; }
      .sidebar-overlay { display: none !important; }
      .sidebar {
        position: relative;
        transform: translateX(0) !important;
        width: 300px;
        height: calc(100vh - 72px);
        top: 0;
      }
      .close-sidebar-btn { display: none; }
      .toggle-btn { display: none; }
      .main-content { padding: 40px; }
      .map-header-row { align-items: flex-start; text-align: left; }
      .map-main-title { font-size: 36px; text-align: left; }
      .map-aredl-badge { font-size: 18px; padding: 4px 12px; }
      .detail-grid { display: grid; grid-template-columns: 16fr 9fr; gap: 24px; margin-bottom: 28px; }
      .stat-card { padding: 20px; border-radius: 16px; }
      .stat-label { font-size: 13px; margin-bottom: 6px; }
      .stat-value { font-size: 22px; }
      .victors-btn { padding: 16px; border-radius: 14px; font-size: 16px; }
      .victors-list-box { padding: 16px 20px; border-radius: 14px; max-height: 280px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">KRM FORUM</a>
    <a href="/" class="header-right">LRR LIST</a>
  </header>

  <div class="container">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="맵 이름 검색..."
          oninput="filterMaps()"
        />
        <button class="close-sidebar-btn" onclick="toggleSidebar()">✕</button>
      </div>
      <ul class="map-list" id="mapList"></ul>
    </aside>

    <main class="main-content">
      <div class="content-box">
        <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

        <div class="map-header-row">
          <h1 class="map-main-title" id="mapTitle">#1. Loading...</h1>
          <span class="map-aredl-badge" id="mapAredlBadge" style="display:none;">-</span>
        </div>

        <div class="detail-grid">
          <div class="video-box" id="videoContainer">
            <span>영상을 불러오는 중...</span>
          </div>

          <div class="info-side">
            <div class="stat-card" style="border-left: 4px solid var(--accent-orange);">
              <div class="stat-label">First Korean LRR Mobile Victor</div>
              <div class="stat-value" id="firstVictorName">-</div>
            </div>

            <div class="stat-card">
              <div class="stat-label">Total Victors</div>
              <div class="stat-value" id="totalVictorsCount">-</div>
            </div>

            <div class="stat-card">
              <div class="stat-label">List Points</div>
              <div class="stat-value" id="listPoints">-</div>
            </div>
          </div>
        </div>

        <button class="victors-btn" onclick="toggleVictorsBox()">
          <span>전체 클리어자 목록 (Victors)</span>
          <span id="arrowIcon">▼</span>
        </button>

        <div class="victors-list-box" id="victorsBox">
          <div id="victorsContainer"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const LRR_SHEET_ID = '1yP5sJXHAA_dO0iv74nhx4vaT21J2Rl0cNXdzipsB-Y8';
    const MAIN_SHEET_URL = `https://docs.google.com/spreadsheets/d/${LRR_SHEET_ID}/gviz/tq?tqx=out:json`;

    const VIDEO_SHEET_ID = '12q_IKRxveTruikwBjPMGWxCavBjlp9jaTMX-KLCbcF8';
    const VIDEO_SHEET_URL = `https://docs.google.com/spreadsheets/d/${VIDEO_SHEET_ID}/gviz/tq?tqx=out:json&gid=1240231056`;

    let mapDataList = [];
    let videoMap = {};

    async function loadSheetData() {
      try {
        const [mainRes, videoRes] = await Promise.allSettled([
          fetch(MAIN_SHEET_URL),
          fetch(VIDEO_SHEET_URL),
        ]);

        if (videoRes.status === 'fulfilled' && videoRes.value.ok) {
          const videoRaw = await videoRes.value.text();
          parseVideoSheet(videoRaw);
        }

        if (mainRes.status === 'fulfilled' && mainRes.value.ok) {
          const mainRaw = await mainRes.value.text();
          parseMainSheet(mainRaw);
        } else {
          throw new Error('Main sheet load failed');
        }
      } catch (err) {
        console.error('데이터 로드 실패:', err);
        document.getElementById('mapTitle').innerText = '데이터 로드 실패';
      }
    }

    function parseVideoSheet(rawText) {
      try {
        const jsonText = rawText.substring(
          rawText.indexOf('{'),
          rawText.lastIndexOf('}') + 1
        );
        const data = JSON.parse(jsonText);
        const rows = data.table.rows;

        videoMap = {};
        for (let i = 0; i < rows.length; i++) {
          const row = rows[i].c;
          if (!row || !row[0] || !row[0].v) continue;

          const mapName = String(row[0].v).trim().toLowerCase();
          const mainVideoUrl =
            row[1] && row[1].v ? String(row[1].v).trim() : null;

          const customVictors = [];
          for (let j = 2; j < row.length; j++) {
            const cell = row[j];
            if (!cell || cell.v === null) continue;

            const val = String(cell.v).trim();
            if (val === '') continue;

            if (val.startsWith('http')) {
              if (customVictors.length > 0) {
                customVictors[customVictors.length - 1].link = val;
              }
            } else {
              customVictors.push({ name: val, link: null });
            }
          }

          if (mapName) {
            videoMap[mapName] = {
              videoUrl: mainVideoUrl,
              victors: customVictors,
            };
          }
        }
      } catch (e) {
        console.warn('비디오 시트 파싱 중 오류:', e);
      }
    }

    function parseMainSheet(rawText) {
      const jsonText = rawText.substring(
        rawText.indexOf('{'),
        rawText.lastIndexOf('}') + 1
      );
      const data = JSON.parse(jsonText);
      const rows = data.table.rows;

      mapDataList = [];
      let currentRank = 1;

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i].c;
        if (!row || !row[0] || !row[0].v) continue;

        const levelName = String(row[0].v).trim();
        const lowerLevelName = levelName.toLowerCase();

        if (
          lowerLevelName === 'levels' ||
          lowerLevelName.startsWith('last update') ||
          lowerLevelName.startsWith('records & information') ||
          lowerLevelName.includes('last update:')
        ) {
          continue;
        }

        let totalVictors = '0';
        if (row[1] && row[1].v !== null && row[1].v !== undefined) {
          totalVictors = String(row[1].v).trim();
        }

        const rawCCol = row[2] && row[2].v !== null ? String(row[2].v).trim() : '';

        let displayRank = `#${currentRank}`;
        let badgeText = '';

        if (rawCCol !== '') {
          badgeText = rawCCol;
        }
        currentRank++;

        const defaultVictors = [];
        for (let j = 5; j < row.length; j++) {
          const cell = row[j];
          if (!cell || cell.v === null) continue;

          const val = String(cell.v).trim();
          if (val === '' || val === '-') continue;

          defaultVictors.push({ name: val, link: null });
        }

        const matchedKey = Object.keys(videoMap).find(
          (k) => k.toLowerCase() === levelName.toLowerCase()
        );
        const customData = matchedKey ? videoMap[matchedKey] : null;

        const finalVideoUrl = customData ? customData.videoUrl : null;
        const finalVictors =
          customData && customData.victors.length > 0
            ? customData.victors
            : defaultVictors;

        mapDataList.push({
          rank: displayRank,
          title: levelName,
          badge: badgeText,
          totalVictors: totalVictors,
          listPoints: '-',
          videoUrl: finalVideoUrl,
          victors: finalVictors,
        });
      }

      renderSidebar();
      handleHashChange();
    }

    function renderSidebar() {
      const listEl = document.getElementById('mapList');
      listEl.innerHTML = '';

      const indexed = mapDataList.map((map, originalIndex) => ({
        map,
        originalIndex,
      }));

      indexed.forEach(({ map, originalIndex }) => {
        const li = document.createElement('li');
        li.className = 'map-item';
        li.dataset.index = String(originalIndex);

        li.onclick = () => {
          selectMap(originalIndex);
          if (window.innerWidth < 768) toggleSidebar();
        };

        li.innerHTML = `
          <span class="rank">${map.rank}</span>
          <span class="title">${map.title}</span>
        `;
        listEl.appendChild(li);
      });

      syncActiveByCurrentHash();
    }

    function syncActiveByCurrentHash() {
      const hash = window.location.hash.replace('#', '');
      const targetIndex = hash ? parseInt(hash, 10) - 1 : 0;

      const clamped = mapDataList.length
        ? Math.max(0, Math.min(targetIndex, mapDataList.length - 1))
        : 0;

      document.querySelectorAll('.map-item').forEach((el) => {
        const elIndex = parseInt(el.dataset.index, 10);
        el.classList.toggle('active', elIndex === clamped);
      });
    }

    function selectMap(index) {
      const map = mapDataList[index];
      if (!map) return;

      if (window.location.hash !== `#${index + 1}`) {
        history.replaceState(null, null, `#${index + 1}`);
      }

      document.querySelectorAll('.map-item').forEach((el) => {
        const elIndex = parseInt(el.dataset.index, 10);
        el.classList.toggle('active', elIndex === index);
      });

      document.getElementById('mapTitle').innerText = `${map.rank}. ${map.title}`;

      const badgeEl = document.getElementById('mapAredlBadge');
      if (map.badge && map.badge !== '') {
        badgeEl.innerText = map.badge;
        badgeEl.style.display = 'inline-block';
      } else {
        badgeEl.style.display = 'none';
      }

      document.getElementById('totalVictorsCount').innerText = map.totalVictors;
      document.getElementById('listPoints').innerText = map.listPoints;

      const videoBox = document.getElementById('videoContainer');
      let targetVideo = map.videoUrl;

      if (targetVideo && targetVideo.includes('youtu')) {
        const videoId = extractYoutubeId(targetVideo);
        if (videoId) {
          videoBox.innerHTML = `
            <iframe
              src="https://www.youtube.com/embed/${videoId}?vq=hd1080&enablejsapi=1"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
            ></iframe>
          `;
        } else {
          videoBox.innerHTML = '<span style="color:#64748b;">등록된 영상이 없습니다.</span>';
        }
      } else {
        videoBox.innerHTML = '<span style="color:#64748b;">등록된 영상이 없습니다.</span>';
      }

      if (map.victors.length > 0) {
        document.getElementById('firstVictorName').innerText =
          map.victors[0].name;
      } else {
        document.getElementById('firstVictorName').innerText = '-';
      }

      renderVictorsList(map.victors);
    }

    function renderVictorsList(victors) {
      const container = document.getElementById('victorsContainer');
      container.innerHTML = '';

      if (!victors || victors.length === 0) {
        container.innerHTML =
          '<div style="color:var(--text-sub); font-size:14px;">클리어자가 없습니다.</div>';
        return;
      }

      victors.forEach((v, idx) => {
        const item = document.createElement('div');
        item.className = 'victor-item';

        const rankSpan = `<span class="victor-rank">${idx + 1}.</span>`;

        let nameEl = (v.link && v.link.startsWith('http'))
          ? `<a href="${v.link}" target="_blank" class="victor-name has-link">${v.name} 🔗</a>`
          : `<span class="victor-name">${v.name}</span>`;

        item.innerHTML = rankSpan + nameEl;
        container.appendChild(item);
      });
    }

    function extractYoutubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return match && match[2].length === 11 ? match[2] : null;
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    function toggleVictorsBox() {
      const box = document.getElementById('victorsBox');
      box.classList.toggle('active');
      document.getElementById('arrowIcon').innerText =
        box.classList.contains('active') ? '▲' : '▼';
    }

    function filterMaps() {
      const query = document.getElementById('searchInput').value.toLowerCase();

      const indexed = mapDataList.map((map, originalIndex) => ({
        map,
        originalIndex,
      }));

      const filtered = indexed.filter(({ map }) =>
        map.title.toLowerCase().includes(query)
      );

      const listEl = document.getElementById('mapList');
      listEl.innerHTML = '';

      filtered.forEach(({ map, originalIndex }) => {
        const li = document.createElement('li');
        li.className = 'map-item';
        li.dataset.index = String(originalIndex);

        li.onclick = () => {
          selectMap(originalIndex);
          if (window.innerWidth < 768) toggleSidebar();
        };

        li.innerHTML = `
          <span class="rank">${map.rank}</span>
          <span class="title">${map.title}</span>
        `;
        listEl.appendChild(li);
      });

      syncActiveByCurrentHash();
    }

    function handleHashChange() {
      const hash = window.location.hash.replace('#', '');
      const targetIndex = hash ? parseInt(hash, 10) - 1 : 0;

      if (mapDataList.length > 0) {
        const clamped = Math.max(
          0,
          Math.min(targetIndex, mapDataList.length - 1)
        );
        selectMap(clamped);
      }
    }

    window.addEventListener('hashchange', handleHashChange);

    loadSheetData();
  </script>
</body>
</html>
