<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRR List - KRM FORUM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0d14;
            --panel-bg: #121824;
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f2fe;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Pretendard', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(18, 24, 36, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            height: 64px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-family: 'Orbitron'; font-size: 20px; font-weight: 900; color: var(--accent-cyan); text-decoration: none; }

        .container {
            display: flex;
            flex-grow: 1;
            height: calc(100vh - 64px);
            overflow: hidden;
            position: relative;
        }

        /* ⬅️ 접을 수 있는 사이드바 */
        .sidebar {
            width: 320px;
            background: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s ease;
            z-index: 10;
        }

        .sidebar.collapsed { margin-left: -320px; }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            gap: 10px;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .map-list { flex-grow: 1; overflow-y: auto; list-style: none; }
        .map-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--panel-border);
            cursor: pointer;
            transition: background 0.2s;
        }
        .map-item:hover, .map-item.active { background: rgba(0, 242, 254, 0.08); }
        .map-item .rank { font-family: 'Orbitron'; color: var(--accent-cyan); font-weight: 800; font-size: 14px; margin-right: 6px; }
        .map-item .title { font-weight: 700; font-size: 16px; }

        .toggle-btn {
            position: absolute;
            left: 320px;
            top: 16px;
            z-index: 20;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            transition: left 0.3s ease;
        }
        .sidebar.collapsed + .toggle-btn { left: 0; }

        /* ➡️ 메인 콘텐츠 영역 (그림판 스케치 구현) */
        .main-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content-box { width: 100%; max-width: 960px; }

        /* n. blabla 타이틀 */
        .map-main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 28px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 16fr 9fr;
            gap: 24px;
            margin-bottom: 32px;
        }

        /* 비디오 / 검은 화면 박스 */
        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
        }

        .video-box iframe { width: 100%; height: 100%; border: none; }

        /* 오른쪽 정보 스탯 카드들 */
        .info-side { display: flex; flex-direction: column; gap: 16px; }
        
        .stat-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
        }

        .stat-label { font-size: 13px; color: var(--text-sub); margin-bottom: 6px; font-weight: 600; }
        .stat-value { font-size: 22px; font-weight: 800; }

        /* 클리어자 목록 accordion */
        .victors-btn {
            width: 100%;
            padding: 16px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .victors-list-box {
            display: none;
            margin-top: 12px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            max-height: 280px;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .victors-list-box.active { display: block; }

        .victor-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .victor-item:last-child { border-bottom: none; }
        
        .victor-rank { font-family: 'Orbitron'; color: var(--text-sub); font-size: 14px; width: 36px; }

        .victor-name { font-size: 16px; color: var(--text-main); text-decoration: none; }
        
        /* 🔗 링크가 있는 유저 -> 밑줄 표시 */
        .victor-name.has-link {
            text-decoration: underline;
            color: var(--accent-cyan);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">KRM FORUM</a>
        <div style="font-family:'Orbitron'; font-weight:800; color:var(--accent-cyan);">HRR LIST</div>
    </header>

    <div class="container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <input type="text" class="search-input" id="searchInput" placeholder="맵 이름 검색..." oninput="filterMaps()">
            </div>
            <ul class="map-list" id="mapList"></ul>
        </aside>

        <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

        <main class="main-content">
            <div class="content-box">
                <h1 class="map-main-title" id="mapTitle">#1. Loading...</h1>

                <div class="detail-grid">
                    <div class="video-box" id="videoContainer">
                        <span>영상을 불러오는 중...</span>
                    </div>

                    <div class="info-side">
                        <div class="stat-card" style="border-left: 4px solid var(--accent-cyan);">
                            <div class="stat-label">First Korean HRR Mobile Victor</div>
                            <div class="stat-value" id="firstVictorName">-</div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-label">Total Victors</div>
                            <div class="stat-value" id="totalVictorsCount">-</div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-label">List Points</div>
                            <div class="stat-value" id="listPoints">-</div>
                        </div>
                    </div>
                </div>

                <button class="victors-btn" onclick="toggleVictorsBox()">
                    <span>전체 클리어자 목록 (Victors)</span>
                    <span id="arrowIcon">▼</span>
                </button>
                <div class="victors-list-box" id="victorsBox">
                    <div id="victorsContainer"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const HRR_SHEET_ID = '1f1lwB1kbOpD4IWBiTf-D3wDeqpCA5nz-fkNIhr4ZO14';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${HRR_SHEET_ID}/export?format=csv&gid=0`;

        let mapDataList = [];

        // 구글 시트 CSV 파싱 및 동적 로드
        async function loadSheetData() {
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                parseCSV(csvText);
            } catch (err) {
                console.error("데이터 로드 실패:", err);
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            mapDataList = [];

            // 헤더(2번 줄) 제외하고 데이터 파싱
            for (let i = 2; i < lines.length; i++) {
                const cols = lines[i].split(',').map(c => c.replace(/^"(.*)"$/, '$1').trim());
                if (!cols[0]) continue; // 맵 이름 없으면 스킵

                const levelName = cols[0];
                const totalVictors = cols[1] || '0';
                const rank = cols[3] || `#${i - 1}`;
                
                // 비디오/클리어자 정보 (F열 이후의 유효한 셀만 모음 - 빈셀 스킵)
                const rawVictors = cols.slice(5).filter(cell => cell && cell.length > 0);
                
                const victors = rawVictors.map(item => {
                    // 텍스트/링크 구조 파악
                    return {
                        name: item,
                        link: item.startsWith('http') ? item : null // URL 형식 체크
                    };
                });

                mapDataList.push({
                    rank: rank,
                    title: levelName,
                    totalVictors: totalVictors,
                    victors: victors
                });
            }

            renderSidebar(mapDataList);
            
            // URL 파라미터 체크 (예: /hrr/#2 -> 2등 로드, 없으면 1등 로드)
            const hash = window.location.hash.replace('#', '');
            const targetIndex = hash ? parseInt(hash) - 1 : 0;
            selectMap(Math.max(0, targetIndex));
        }

        function renderSidebar(data) {
            const listEl = document.getElementById('mapList');
            listEl.innerHTML = '';
            data.forEach((map, index) => {
                const li = document.createElement('li');
                li.className = 'map-item';
                li.onclick = () => selectMap(index);
                li.innerHTML = `<span class="rank">${map.rank}</span><span class="title">${map.title}</span>`;
                listEl.appendChild(li);
            });
        }

        function selectMap(index) {
            const map = mapDataList[index];
            if (!map) return;

            // 주소 변경 (#순위 형태)
            window.location.hash = index + 1;

            // 사이드바 하이라이트
            document.querySelectorAll('.map-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            // 화면 데이터 업데이트
            document.getElementById('mapTitle').innerText = `${map.rank}. ${map.title}`;
            document.getElementById('totalVictorsCount').innerText = map.totalVictors;
            document.getElementById('listPoints').innerText = '-';

            // 최초 승리자 & 영상 연동 처리
            const videoBox = document.getElementById('videoContainer');
            if (map.victors.length > 0) {
                const firstVictor = map.victors[0];
                document.getElementById('firstVictorName').innerText = firstVictor.name;

                // 유튜브 링크가 있는 경우
                if (firstVictor.link && firstVictor.link.includes('youtu')) {
                    const videoId = extractYoutubeId(firstVictor.link);
                    videoBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
                } else {
                    // 링크가 없으면 검은 화면만 출력
                    videoBox.innerHTML = `<span style="color:#64748b;">등록된 영상이 없습니다.</span>`;
                }
            } else {
                document.getElementById('firstVictorName').innerText = '-';
                videoBox.innerHTML = `<span style="color:#64748b;">등록된 영상이 없습니다.</span>`;
            }

            // 전체 클리어자 목록 생성
            renderVictorsList(map.victors);
        }

        function renderVictorsList(victors) {
            const container = document.getElementById('victorsContainer');
            container.innerHTML = '';

            if (victors.length === 0) {
                container.innerHTML = '<div style="color:var(--text-sub); font-size:14px;">클리어자가 없습니다.</div>';
                return;
            }

            victors.forEach((v, idx) => {
                const item = document.createElement('div');
                item.className = 'victor-item';

                const rankSpan = `<span class="victor-rank">${idx + 1}.</span>`;
                
                // 링크 있으면 밑줄 닉네임, 없으면 일반 이름
                let nameEl = '';
                if (v.link) {
                    nameEl = `<a href="${v.link}" target="_blank" class="victor-name has-link">${v.name}</a>`;
                } else {
                    nameEl = `<span class="victor-name">${v.name}</span>`;
                }

                item.innerHTML = rankSpan + nameEl;
                container.appendChild(item);
            });
        }

        function extractYoutubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function toggleVictorsBox() {
            const box = document.getElementById('victorsBox');
            box.classList.toggle('active');
            document.getElementById('arrowIcon').innerText = box.classList.contains('active') ? '▲' : '▼';
        }

        function filterMaps() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = mapDataList.filter(m => m.title.toLowerCase().includes(query));
            renderSidebar(filtered);
        }

        loadSheetData();
    </script>
</body>
</html>
