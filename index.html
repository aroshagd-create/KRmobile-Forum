<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRM FORUM</title>
    <!-- ✅ 5분 캐싱 설정 -->
    <meta http-equiv="Cache-Control" content="public, max-age=300">
    <meta http-equiv="Pragma" content="cache">
    <meta http-equiv="Expires" content="300">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0d14;
            --panel-bg: #121824;
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-main: #FF9900;
            --accent-orange: #ff9f43;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Pretendard', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a:focus, button:focus {
            outline: 2px solid var(--accent-main);
            outline-offset: 1px;
        }
        header {
            background: rgba(18, 24, 36, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            height: 72px;
            padding: 0 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-family: 'Orbitron';
            font-size: 24px;
            font-weight: 900;
            color: var(--accent-main);
            text-decoration: none;
        }
        .container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(28px, 8vw, 48px);
            font-weight: 900;
            color: var(--accent-main);
            margin-bottom: 12px;
            text-align: center;
        }
        .sub-title {
            font-size: 18px;
            color: var(--text-sub);
            margin-bottom: 48px;
            text-align: center;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
        }
        .menu-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 28px 24px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .menu-card:hover {
            border-color: var(--accent-main);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(255, 153, 0, 0.12);
            background: rgba(255, 153, 0, 0.04);
        }
        .menu-card-title {
            font-family: 'Orbitron';
            font-size: 22px;
            font-weight: 800;
            color: var(--accent-main);
        }
        .menu-card-desc {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.5;
        }
        footer {
            padding: 24px;
            text-align: center;
            color: var(--text-sub);
            font-size: 13px;
            border-top: 1px solid var(--panel-border);
            margin-top: auto;
        }
        @media (max-width: 768px) {
            header { padding: 0 16px; height: 64px; }
            .logo { font-size: 20px; }
            .menu-grid { grid-template-columns: 1fr; }
            .menu-card { padding: 24px 20px; }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">KRM FORUM</a>
    </header>
    <main class="container">
        <h1 class="main-title">KRM FORUM</h1>
        <p class="sub-title">Korean Record Master Forum — 리스트 선택</p>
        
        <div class="menu-grid">
            <a href="/hrr/" class="menu-card">
                <div class="menu-card-title">HRR LIST</div>
                <div class="menu-card-desc">Hardest Remaining Records — 가장 어려운 맵 순위</div>
            </a>
            <a href="/lrr/" class="menu-card">
                <div class="menu-card-title">LRR LIST</div>
                <div class="menu-card-desc">Longest Remaining Records — 가장 오래 깨지지 않은 기록</div>
            </a>
        </div>
    </main>
    <footer>
        © 2025 KRM FORUM. All rights reserved.
    </footer>
</body>
</html>
